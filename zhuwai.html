<style>
/* 版面：舊上海月份牌與畫報。瘦長的單篇冊頁，直排由右至左；封面為外灘暮色剪影，題名在右、作者在左下 */
:root{
  --desk:#1D1A17;
  --paper:#E8DCC0;

  --serif:"Songti TC","PMingLiU","MingLiU",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--serif);
  background-image:radial-gradient(ellipse at 50% 20%,#2C2621 0%,var(--desk) 65%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow-x:hidden}
.spread{display:flex;flex-direction:row-reverse;gap:6px;justify-content:center;align-items:flex-start;max-width:100%}
.page{position:relative;width:var(--pw);height:var(--ph);flex:none;background:var(--paper);overflow:hidden;
  box-shadow:0 22px 44px -16px rgba(0,0,0,.75),inset 0 0 40px rgba(120,85,40,.25);border-radius:2px}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.6;
  background:radial-gradient(circle at 15% 12%,rgba(140,100,50,.22) 0 5%,transparent 13%),
    radial-gradient(circle at 85% 88%,rgba(140,100,50,.2) 0 4%,transparent 11%),
    radial-gradient(circle at 60% 40%,rgba(140,100,50,.06) 0 20%,transparent 45%),
    repeating-linear-gradient(90deg,rgba(80,60,30,.03) 0 1px,transparent 1px 4px)}
.turn{animation:turn .55s cubic-bezier(.3,.1,.2,1)}
@keyframes turn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* 內頁 */
.inner{position:absolute;inset:var(--pad);display:flex;flex-direction:column}
.deco{height:10px;flex:none;margin-bottom:12px;background:

.vtext .intro b{color:var(--cinnabar)}
.folio{position:absolute;bottom:calc(var(--pad) - 18px);left:var(--pad);font-size:12px;color:var(--ink-soft);letter-spacing:.3em}
.folio b{color:var(--cinnabar);font-weight:600}

/* 封面：舊印刷品，褪色、斑駁、邊角泛黃 */

.cover::before{display:none}

<script>
const CN="〇一二三四五六七八九".split("");
function cn(n){if(n<10)return CN[n];if(n<20)return "十"+(n%10?CN[n%10]:"");return CN[Math.floor(n/10)]+"十"+(n%10?CN[n%10]:"");}
const blocks=[
 {t:'intro',h:'<b>作品簡介</b>　外派上海的工作經驗，以及對生活的感想與體驗。'},
 {t:'p',s:"有一部打字機，蜷縮在那木製的大書桌旁的鐵製櫃子上。鐵櫃子的外表是生了鏽的，遠遠的看倒像是生活艱辛的血跡斑斑。他們在這些好看的老家具裡逛著，承襲著前人的生活軌跡，只是這裡的老家具大得有聲有勢，充滿各式老派中國風采，對於他們而言，在張愛玲的城市裡，買張槐木書桌在弄堂的房子裡，你就更接近中國了。這種接近，是最快也最簡單的，是外在的形體，用金錢就可以解決。而真正的鄉愁你可以在買得到黑松沙士與可樂果蠶豆酥的小店裡找到，或是在那牛肉麵店裡。"},
 {t:'p',s:"上海仍然是新舊交替的。就像南京西路上，右手邊是高聳入天的恆隆廣場，左手邊即是靜安四層樓的公寓小區，樹蔭層層，而門口的生育管制，理直氣壯地。走在路上，撓頭張望，迎面的是杜月笙與胡錦濤的世代交替，衝突卻也莫名的合理。剛到這路上，樹是禿的，剩下的樹幹並不筆直，人們老愛說筆直的樹幹，好像上海非加個灘，才能隱約有那樣可人的文化脈絡與歷史霸道。因為天冷，樹葉在這般天氣活該也應是掉光的，否則一會兒等下雪了，就顯得可憐兮兮了。對於她看到的中國而言，感受到的符號表徵是一陣比一陣的強烈，食衣住行都是展示品味的差異的社會空間。南京西路的熱鬧充滿消費意識，許多穿著西裝打著領帶的上班族在冷天快速行走，我們總以為不同地方會有折煞人的不同，但是熟悉感卻在全家便利超商的門鈴聲中響起，在不同腔調的普通話中驚醒。"},
 {t:'p',s:"來到上海，是十一月天。十多年前來過一遭，其實到一個地方，如果是旅遊，就是盡其所能地把旅遊指南上的風花雪月都一次吞了，抱的是下不為例似的決心。十多年前那一次，上海剛有了新天地，上海剛有了捷運，一切都是往前走的打算，剛有的四季飯店，在十多年前的除夕夜還住了Ｆ４，她在樓下望著，想像一揮揮手的窗景，看著上海人過年是上了館子吃著年夜飯，一輪又一輪，末了，孩子們還真一套唐裝飽滿，胸前一刺繡方型紅包袋，擺明搶劫大人放贓款，只是紅衣金線湊上節日，就不論罪了。"},
 {t:'h',s:"上海四處亂逛　看的是兩個地方的人生"},
 {t:'p',s:"今次來，赴的是二十年前的約，這一折，上海的皺紋是給高樓畫的，斑駁了，複雜了，成熟了，城隍廟的鋪子裡擺的不是咿咿呀呀的收音機了，是薄薄的液晶電視了。但是城隍廟那寧波湯團還是守舊的味道與缺角的瓷湯匙。"},
 {t:'p',s:"對她跟他而言，他們兩個在上海的四處亂逛，除了戀愛之外，看的是兩個地方的人生。對於生長在台灣充滿二二八討論的語言，選舉的賣弄的兩個人，躲到上海竟也規避了不同黨派的信仰，除了新聞不吵之外，生活自然也沒有了爭論。沒有人可以想像，以往被罵到個妖魔的共產黨社會，竟也成了厭惡台灣吵鬧的避風港。他們在這裡，電視節目乾淨得可以，清一色的新聞對他們而言，不吵的清靜令人有股清新的感覺，而要看的自由娛樂大可以建立在隨處可見的ＤＶＤ販售店，音樂與電影都是最新的便宜，那些關於著作權的訓練，很快的在生活中妥協。"},
 {t:'p',s:"石庫房裡面躲著一家小餐廳，這家餐廳是他們二十年來沒有見面，下了飛機直奔而來的餐廳。所以就代表了一個久別重逢的意義，偏偏他又說，以後我只會跟妳來，所以餐廳竟有了守貞的大帽子。外派上海，是男人步步高升的開始，背後卻也開始參雜著寂寞，不管是台商或是派駐的高級幹部在霓虹燈充滿的你儂我儂，寂寞的手游移在水蛇腰上是不變的默契。"},
 {t:'p',s:"或許吧，在台灣仍舊是遙遙遠望著，當你看著鄉土劇的同時，你無法想像《手機》裡面的佈景充滿美式後現代的摩登，而看見《蝸居》裡面宋思明的生活，你也才知道原來財富在中國已是這般張牙舞爪。他們的飯局就是這般的揉著所有中國大陸新一代的景象，他是外商公司派駐的高級幹部，她是他大學時沒有談成戀愛的學妹，因為在臉書上給他留了一句問候語，於是她成了千里迢迢的中年知己。他們兩個在這裡吃的飯，都是就著一個月一個月的相聚，每次到了上海的第一頓或是最後要離開的那一頓飯，就在要下雪的冷凍裡呵著氣跳進房裡找位置。"},
 {t:'h',s:"在一起吃飯喝茶　卻小心翼翼不碰觸那想念"},
 {t:'p',s:"外商的高級幹部要適應的是在台灣那不足人家一個城市的銷售數字，中國的成長就如數字一般快速，也如數字一般大得嚇人，在這裡的適應與紙醉金迷有點隔閡，而那隔閡來自於許多遙不可及數字的觀望。這個數字既大又多，但是實際背後用經濟學或是統計學的公式拆解，卻有著不像台灣那樣小而美的實際。成長成了一個量的累積而不論質的參與，許多的台幹總在嚇人的數字下屈服，而也必須有著貌合神離的工作委屈。"},
 {t:'p',s:"在這裡工作面對的是不同以往的地大物博與人口，最折騰人的是文化差異，以及來自於教育深處所告訴你的種種思維衝突。看著中國前進，台灣幹部的智慧抓著西裝皮鞋的印痕，不知該走快還是放慢腳步，因為急速前進的過程，除了保持競爭力你還要適應同文同種的差異。初到上海時，你很明顯知道自己的不同，知道不適應，但一個男人怎好到了中年還為了家鄉而哭泣？於是你可以看見這些聚在一起的同鄉，在一起吃飯喝茶卻小心翼翼不碰觸那想念。每個人嚷得都很大聲，習著中國的文化價值，卻在心裡不讓寂寞出聲。"},
 {t:'p',s:"這家餐廳的領班，是一個長得白白淨淨的男孩子，小心的，不唐突地，講話的方式讓人舒服。沒有侵略性與攻擊性的講話方式，旁邊垂手等待的樣子，是來自於另一種家鄉與層次的謙卑與恭維，甚至這樣的差異就很簡單的在高樓大廈與石庫房小餐廳顯現，猶如他們與他之間。她可以感覺他對她的想望，因為他們是來自於台灣的兩個好看的人，就像大家常要說的阿里山與太魯閣。女生笑笑的，男人吃飯就是要餵著她。她看見這男孩的眼神，就在眼角給他一抹笑。第二次之後他會問，要哪裡的位置？開始告訴她要喝甚麼茶，今天來了甚麼食材。"},
 {t:'p',s:"對她而言，她有著自己感覺在心裡的關心以及呵護，對他而言這是一個財富的炫耀以及社會的階級。漸漸地，她問他：你打哪兒來？他說：山東！坐的位置可以看見他忙進忙出招呼，她看著他拿著紙，認真地寫下每一道客人點下的佳餚，白白的紙，就像這個男孩，讓都市的一筆一畫在紙上墨刻。經常地他們來吃飯，他就遠遠地看著，仔細地記錄她吃了甚麼，不吃甚麼，最愛的是一道簡單的蟹粉，用的是大閘蟹的肉與蟹膏，讓阿姨坐在地上的板凳，慢慢剝、慢慢剝，之後加上粉條作出來的一道菜，顏色澄黃，如古時皇帝與庶民之別。他也記錄她吃過甚麼，盡量地帶給她生命驚喜，她說他，你好用心喔。男孩淺淺的笑著，在他的工作裡守分認真。這吃飯的感覺就是道地的一股電影風采，充滿民初時代文字語彙在菜單上顯現，縱使都是用筷子，都能感覺到不同的氛圍。"},
 {t:'h',s:"語言裡有兩岸差距的智慧卻失不了文字的美"},
 {t:'p',s:"她的他總用手機裡的上海點評網找著餐廳吃飯，你說中國不自由，但在網路上對於餐廳的言論可是到位的精彩。像他這樣派駐到上海的男人，因為要珍惜羽毛，連嫖妓都是小心翼翼，乾脆不去，因為寂寞與空虛是混合著。上海近年來如果不沾情色的休閒，大概就是去正派的足浴了。對於他而言，走在台灣也有的南京西路，那不同經緯度的溫度就如同他心裡的感受一般。走在回家的路上，他的講話的伴侶是在路口的一家手製西裝店，走過幾次經過櫥窗，他走進去，跟他們打打招呼，因為天天走過，派著菸就熟絡了起來，於是他就訂作西裝，像是一個要話的交易。兩個師傅是老派上海人，好的手藝，在時代的尾巴以及浪頭上緊緊抓著生活的顛沛，對於他，有著好奇與珍惜。"},
 {t:'p',s:"每天他回家時，就來試試尺寸，師傅在量衣拈寸時，細心的尺在身上比畫，讓他享受一點溫暖，有人擔憂著有人問著，像是小時候一般。互相點上菸，上一壺茶，就是大人般的交往了。師傅也拿紙仔細記錄他五十年累積的肉體外在，而心靈就在問候與閒聊裡慢慢填滿。在日常生活裡，不管走在哪裡，靠的是簡單伸進你生活中的手腳滿足你卑微的慰藉。慢慢地生活中也有了市井小民的友情，你習慣了點評，習慣了要靠譜，語言裡有兩岸差距的智慧卻失不了文字的美，你甚至喜歡中國文字的直接，雖然台灣人有台灣人含蓄厚道謙卑的美。但這種感覺微不足道的感情，是滋養著的，不帶任何威脅地，在生活中形成了默契。從你食衣住行的照顧裡，慢慢累積。他也帶她一起去挑西裝的材料布，中國愛問，你愛人？他笑笑，她也笑笑，在中國的愛人指的是婚姻，在愛情意識裡，以台灣人的理解，愛人可是肉麻兮兮的稱謂，他們在他逃離婚姻的中國成了台灣人角度的愛人。"},
 {t:'p',s:"再來到石庫房的小餐廳吃飯，那領班不見了，他們都忍住沒問，先是東張西望的找，再來則是在一頓飯裡，失卻了被關心的足跡。還是不自在的失落，最後他都忍不住開口問了，簡單的一句，他回鄉了，在他們兩個的心裡留下秋海棠地大物博的距離；有些微笑的友情就這麼失落在十三億的茫茫人海裡，再問一句都是多餘。他們靜靜的吃著飯，他說，怎覺得今天的蟹粉，太粉了些，濃稠了點？那個不自在的失去，表現在不對味的菜餚裡。"},
 {t:'p',s:"他們急急離開餐廳，心裡有楚，美麗的味道要配上那記錄的紙筆，飛快的寫著你心之所欲，少了，就像菜少了調味品，用餐裡少了情感的儀式。令人驚訝的是，他們心裡對於一個領班的感覺，既陌生又熟悉。"},
 {t:'p',s:"他們走回旅館的路上，經過西裝店，她說：要不要進去坐坐？他說：都調回台灣了，不進去了！她心裡知道，對於離開上海，隔了一個海岸，生活變化很大，他回家，離她很近距離卻遠比上海來得遙不可及。路旁的法國梧桐開得很燦爛的淘淘的葉子，友情也有春夏秋冬，那個慰藉很短暫，但是卻很實在，她想對這個男人而言，原來上海的一切也是另一種近鄉情怯。"},
 {t:'p',s:"幹部的調動在外商的眼裡是即時的公告，一紙下來就人仰馬翻，她在旁邊看著，對於生活的適應，寂寞的溫度，才剛開始找到方法安頓。她想，他們會不會如我一樣的思念？在台灣燠熱的夏天。"}

const spread=document.getElementById('spread');
let pages=[], cur=0, perView=1;

function sizeVars(){
  const vh=innerHeight, vw=document.documentElement.clientWidth-32;
  let ph=Math.min(vh-120, 820); ph=Math.max(ph,460);
  let pw=Math.round(ph*0.56);
  const two = vw >= pw*2+6 && vw>=760;
  if(!two && pw>vw){pw=vw; ph=Math.round(pw/0.56); if(ph>vh-110){ph=vh-110;}}
  const fs=Math.max(14,Math.min(17,Math.round(pw/24)));
  const pad=Math.round(pw*0.09);
  const r=document.documentElement.style;
  r.setProperty('--pw',pw+'px');r.setProperty('--ph',ph+'px');r.setProperty('--fs',fs+'px');r.setProperty('--pad',pad+'px');
  return two;
}
function pageShell(){
  const pg=document.createElement('section');pg.className='page';
  pg.innerHTML='<div class="inner"><div class="deco"></div><div class="vtext"></div><div class="deco bottom"></div></div><div class="folio"></div>';
  return pg;
}
function makeBlock(b,text,cont){
  if(b.t==='intro'){const d=document.createElement('div');d.className='intro';d.innerHTML=b.h;return d}
  if(b.t==='h'){const h=document.createElement('h2');h.textContent=b.s;return h}
  const p=document.createElement('p');p.textContent=text;if(cont)p.className='cont';return p;
}
function paginate(){
  const meas=document.createElement('div');meas.className='measure';document.body.appendChild(meas);
  let shell=pageShell();meas.appendChild(shell);let box=shell.querySelector('.vtext');
  const out=[];const over=()=>box.scrollWidth>box.clientWidth+1;
  const flush=()=>{out.push(box.innerHTML);box.innerHTML=''};
  blocks.forEach(b=>{
    if(b.t!=='p'){const el=makeBlock(b);box.appendChild(el);if(over()){box.removeChild(el);flush();box.appendChild(el)}return}
    let rest=b.s, cont=false;
    while(rest.length){
      const el=makeBlock(b,rest,cont);box.appendChild(el);
      if(!over()){rest='';break}
      let lo=0,hi=rest.length;
      while(lo<hi){const mid=Math.ceil((lo+hi)/2);el.textContent=rest.slice(0,mid);if(over())hi=mid-1;else lo=mid}
      if(lo===0){box.removeChild(el);flush();continue}
      el.textContent=rest.slice(0,lo);rest=rest.slice(lo);flush();cont=true;
    }
  });
  if(box.innerHTML)flush();
  meas.remove();return out;
}
function coverPage(){
  const pg=document.createElement('section');pg.className='page cover';
  pg.innerHTML=`${document.getElementById('shikumen-tpl').innerHTML}
   <div class="stain">${document.getElementById('stain-tpl').innerHTML}</div>
   <div class="cover-title distress">駐外</div>
   <div class="cover-award distress">兩岸交流紀實文學獎</div>
   <div class="seal distress">優選<br>第二名</div>
   <div class="cover-author distress">鄭婉妮　著<small>二〇一一</small></div>
   <div class="vignette"></div>`;
  return pg;
}
function colophonHTML(){
  return `<dl>
   <dt>篇名</dt><dd>駐外</dd>
   <dt>作者</dt><dd>鄭婉妮</dd>
   <dt>獎項</dt><dd>行政院大陸委員會二十周年　兩岸交流紀實文學獎　優選（第二名）</dd>
   <dt>收錄</dt><dd>《行政院大陸委員會20周年兩岸交流紀實文學暨攝影獎作品集》</dd>
   <dt>書號</dt><dd>ISBN 978-986-02-9832-1</dd>
   <dt>電子版</dt><dd><a href="http://www.mac.gov.tw/public/MMO/RPIR/book526.pdf" target="_blank" rel="noopener">陸委會作品集電子版</a></dd>
   </dl>`;
}
let textPages=[];
function build(){
  perView=sizeVars()?2:1;
  textPages=paginate();
  pages=[{cover:true},...textPages.map(h=>({h})),{colophon:true}];
  cur=Math.min(cur,pages.length-1);
  render(false);
}
function renderPage(i){
  const p=pages[i];
  if(p.cover)return coverPage();
  const pg=pageShell();
  if(p.colophon){pg.classList.add('colophon');pg.querySelector('.vtext').innerHTML=colophonHTML();}
  else pg.querySelector('.vtext').innerHTML=p.h;
  pg.querySelector('.folio').innerHTML=`駐外　<b>${cn(i)}</b>`;
  return pg;
}
function render(anim=true){
  spread.innerHTML='';
  const idx = perView===2 && cur>0 ? [cur, cur+1].filter(i=>i<pages.length) : [cur];
  idx.forEach(i=>{const el=renderPage(i);if(anim)el.classList.add('turn');spread.appendChild(el)});
  const step=perView===2&&cur>0?2:1;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur+ (perView===2&&cur>0?2:1) >= pages.length;
  const last=pages.length-1, nT=textPages.length;
  let label;
  if(cur===0)label='封面';
  else if(cur===last)label='版權頁';
  else{const a=cur, b=Math.min(idx[idx.length-1],nT);label = idx.length>1&&b>a ? `第${cn(a)}、${cn(b)}頁／共${cn(nT)}頁` : `第${cn(a)}頁／共${cn(nT)}頁`;}
  document.getElementById('count').textContent=label;
}
function go(dir){
  const step = perView===2 ? (dir>0 ? (cur===0?1:2) : (cur<=1?1:2)) : 1;
  const n=Math.max(0,Math.min(pages.length-1,cur+dir*step));
  if(n!==cur){cur=n;render(true)}
}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});
let sx=null,sy=null;
spread.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
spread.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);sx=null},{passive:true});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,200)});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(build);
build();
</script>
</body>
